[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kimodo"
version = "1.0.0"
description = "Kimodo motion generation model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.23,<2",
  "scipy>=1.10,<1.15",
  "flatbuffers==25.12.19",
  "transformers==5.8.1",
  "huggingface_hub>=1.0",
  "urllib3>=2.6.3",
  "boto3",
  "modelscope==1.37.1",
  "peft>=0.19",
  "einops>=0.7",
  "vector-quantize-pytorch>=1.25,<1.26",
  "safetensors>=0.4",
  "tqdm>=4.0",
  "packaging>=21.0",
  "pydantic>=2.0",
  "filelock>=3.20.3",
  "bvhio",
]

[project.optional-dependencies]
text-api = [
  "gradio_client>=2.0",
]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
kimodo = ["assets/**/*"]

[tool.flake8]
max-line-length = 120

[tool.ruff]
extend-select = ["I001"]  # Enable import sorting
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["kimodo"]
known-third-party = ["torch", "numpy", "pytorch_lightning", "wandb", "tqdm"]
force-sort-within-sections = false
