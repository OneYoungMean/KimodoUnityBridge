name: sync-to-fulldemo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout KimodoUnityBridge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace FullDemo package directory
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          TARGET_REPOSITORY: OneYoungMean/KimodoUnityBridge_FullDemo
        run: |
          set -euo pipefail

          if [ -z "$GH_SYNC_TOKEN" ]; then
            echo "Missing required GitHub Actions secret: GH_SYNC_TOKEN" >&2
            exit 1
          fi

          target_dir="$(mktemp -d)"
          trap 'rm -rf "$target_dir"' EXIT

          git clone --branch main --single-branch \
            "https://x-access-token:${GH_SYNC_TOKEN}@github.com/${TARGET_REPOSITORY}.git" \
            "$target_dir/repository"

          rm -rf "$target_dir/repository/Packages/KimodoUnityBridge"
          mkdir -p "$target_dir/repository/Packages/KimodoUnityBridge"
          rsync -a --exclude='.git/' \
            "$GITHUB_WORKSPACE/" "$target_dir/repository/Packages/KimodoUnityBridge/"

          cd "$target_dir/repository"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "FullDemo package is already up to date."
            exit 0
          fi

          git commit -m "chore: sync KimodoUnityBridge package"
          git push origin HEAD:main
